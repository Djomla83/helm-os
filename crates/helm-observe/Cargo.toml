[package]
name = "helm-observe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Experimental explicit-target observation of actual Linux filesystem facts"

[dependencies]
serde = "=1.0.228"
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
sha2 = "=0.10.9"

[lints]
workspace = true
