[package]
name = "helm-gui"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "EXPERIMENTAL G2 first real vertical. The native GTK interface driving the accepted helm-launch 0.1 through its public API. Linux x86_64 only. No persistence, no other HELM crate, not an accepted product surface."

# Deliberately excluded from the product workspace; see the note in the root
# Cargo.toml. Because it is not a member it cannot inherit workspace lints, so
# the same policy is restated here verbatim.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# The only dependencies, and the only ones this spike is authorised to have.
# Exact pins, matching the pinning convention the accepted crates already use.
#
# `libadwaita` 0.9.2 depends on `gtk4 ^0.11`, so the two are a matched pair;
# gtk-rs requires the `gtk4` and `libadwaita` crate versions to be kept in step.
# One GTK feature is enabled: `v4_10`, for `gtk::accessible` and
# `update_property`. The spike uses them to mark the decorative state shapes as
# hidden from assistive technology, so that a mark beside a word is not
# announced twice. GTK 4.10 is from 2023 and every currently supported
# distribution carries it or later, so this raises the floor without narrowing
# the target in practice. No other ABI-level feature is enabled on either
# crate, and none is enabled on `libadwaita` at all.
[dependencies]
gtk4 = { version = "=0.11.5", features = ["v4_10"] }
libadwaita = "=0.9.2"

# The accepted launch module, consumed as an ordinary public caller. This crate
# adds nothing to it and changes nothing in it. No other HELM crate is a
# dependency: this vertical touches `helm-evidence`, `helm-app-spec`,
# `helm-observe` and `helm-bind` not at all.
helm-launch = { path = "../helm-launch" }

# Builds the one fixed plan document. A selected file name can contain a quote
# or a backslash, so the document is serialised rather than concatenated; the
# bytes then go through the accepted parser like any other untrusted input.
# Same pin the accepted crates already carry.
serde_json = "=1.0.149"

# The integration test recomputes the receipt digest over the receipt's own
# exact bytes, so that the digest shown in the interface is proven to be the
# identity of those bytes and not something the interface was told. Same pin
# the accepted crates carry.
[dev-dependencies]
sha2 = "=0.10.9"
