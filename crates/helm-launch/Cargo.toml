[package]
name = "helm-launch"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Experimental portable launch-plan and receipt model; P1 only, no execution backend"

[dependencies]
serde = "=1.0.228"
serde_json = "=1.0.149"
sha2 = "=0.10.9"

# The workspace lint table is deliberately NOT inherited (productization plan
# section 7.4, ADR-0024 section E). Cargo cannot combine `workspace = true` with a
# local table, and the workspace `unsafe_code = "forbid"` could not be relaxed for
# the scoped Linux backend that a later, separately authorised slice may add.
# Every workspace lint is therefore restated here, none weaker except the one
# accepted `unsafe_code` exception, and the unsafe-discipline lints are added.
#
# P1 contains no unsafe code at all: `src/lib.rs` restates this `deny` in source
# (not `forbid`, for the same reason), and `tests/p1_boundary.rs` fails on any
# drift of this table or of that attribute.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
