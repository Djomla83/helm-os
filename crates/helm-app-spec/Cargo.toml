[package]
name = "helm-app-spec"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "Experimental pure validation of desired application specifications"

[dependencies]
serde = "=1.0.228"
serde_json = "=1.0.149"
# Avoid runtime CPU feature discovery, including when built outside this workspace.
sha2 = { version = "=0.10.9", features = ["force-soft"] }

[lints]
workspace = true

[[bench]]
name = "parse"
harness = false
