# LAUNCH-EXEC-01 authorised trial — MANUAL DISPATCH ONLY.
#
# This workflow EXECUTES the preregistered experiment. It exists because the
# frozen definition preregisters the trial environment and the workflow
# discipline, and no such workflow existed:
#
#   "Recommended first environment: a GitHub-hosted ubuntu-24.04 runner."
#   "The experiment workflow sets cancel-in-progress: false ..., has no
#    pull_request trigger, and runs only on workflow_dispatch. GitHub's
#    're-run failed jobs' is forbidden; any re-run is a NEW TRIAL with its own
#    report. Evidence is preserved under docs/experiments/evidence/."
#
# D-7 was authorised by the owner on 2026-09-10 for EXACTLY ONE valid trial,
# bound to freeze 89c923a147ff16182d4d0ae14a0bd7bb6e62723d. See
# docs/DECISIONS.md#d-7-authorised.
#
# The workflow FILE lives at a later infrastructure commit, but the experiment
# BYTES EXECUTED are checked out at the authorised freeze and asserted, so a
# later branch tip can never become the thing under test.
#
# The first execution of the first preregistered case is the IMMUTABILITY
# BOUNDARY. Dispatching this workflow is the act that crosses it: D-7 is already
# granted subject to the frozen mandatory gates, so a successful preflight is
# followed by the first case with no further decision point.
name: launch-exec-01 authorised trial

# workflow_dispatch ONLY. No push, no pull_request, no schedule, no
# workflow_run, no repository_dispatch. The definition requires it, and it is
# what makes firing the trial a deliberate act rather than a side effect.
on:
  workflow_dispatch:
    inputs:
      freeze_sha:
        description: 'Authorised freeze commit. Must be exact.'
        required: true
        default: '89c923a147ff16182d4d0ae14a0bd7bb6e62723d'
      manifest_sha256:
        description: 'Authorised SOURCE-HASHES.json SHA-256. Must be exact.'
        required: true
        default: '9fb861602d477a00f014f14f0a31b5979947af18fa2b620b95ac803ab5bfc365'
      confirmation:
        description: 'Type RUN-ONE-VALID-TRIAL. Any re-run is a NEW trial.'
        required: true
        default: ''

permissions:
  contents: read

# Never let a newer run erase a running valid trial. There is no re-run that is
# not a new trial, so a cancelled trial cannot be recovered.
concurrency:
  group: launch-exec-01-trial
  cancel-in-progress: false

env:
  AUTHORISED_FREEZE: 89c923a147ff16182d4d0ae14a0bd7bb6e62723d
  AUTHORISED_MANIFEST_SHA256: 9fb861602d477a00f014f14f0a31b5979947af18fa2b620b95ac803ab5bfc365
  EXPERIMENT_DIR: docs/experiments/launch-exec-01

jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # =================================================== gates before checkout
      # Nothing below can pose a case until every one of these passes, and none
      # of them touches the experiment.

      - name: An Actions re-run is not an authorised trial
        run: |
          set -eu
          attempt='${{ github.run_attempt }}'
          echo "run_attempt: $attempt"
          if [ "$attempt" != "1" ]; then
            echo "HALT: this is Actions attempt $attempt."
            echo "The D-7 decision authorises exactly ONE valid trial, and a"
            echo "re-run is a NEW trial, not a retry of this one. A new trial"
            echo "requires a new explicit owner authorisation."
            exit 1
          fi
          echo "first attempt"

      - name: The dispatch must state the authorised object
        run: |
          set -eu
          fail=0
          if [ '${{ inputs.confirmation }}' != 'RUN-ONE-VALID-TRIAL' ]; then
            echo "HALT: confirmation not given."; fail=1
          fi
          if [ '${{ inputs.freeze_sha }}' != "$AUTHORISED_FREEZE" ]; then
            echo "HALT: freeze_sha is not the authorised freeze."; fail=1
          fi
          if [ '${{ inputs.manifest_sha256 }}' != "$AUTHORISED_MANIFEST_SHA256" ]; then
            echo "HALT: manifest_sha256 is not the authorised manifest."; fail=1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "Nothing was checked out and no case was posed."
            exit 1
          fi
          echo "dispatch inputs match the D-7 decision"

      # ============================================ the exact authorised bytes
      # ref is the hard-coded authorised freeze, never the dispatched branch tip
      # and never an input, so a mistyped or hostile input cannot redirect what
      # gets executed. The input is a separate cross-check, above.
      - name: Check out the AUTHORISED FREEZE, not a branch tip
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 89c923a147ff16182d4d0ae14a0bd7bb6e62723d
          fetch-depth: 0
          persist-credentials: false

      - name: Assert the checked-out bytes ARE the authorised freeze
        run: |
          set -eu
          head=$(git rev-parse HEAD)
          echo "checked out: $head"
          if [ "$head" != "$AUTHORISED_FREEZE" ]; then
            echo "HALT: checkout is not the authorised freeze."; exit 1
          fi
          actual=$(sha256sum "$EXPERIMENT_DIR/SOURCE-HASHES.json" | cut -d' ' -f1)
          echo "SOURCE-HASHES.json sha256: $actual"
          if [ "$actual" != "$AUTHORISED_MANIFEST_SHA256" ]; then
            echo "HALT: manifest is not the authorised manifest."; exit 1
          fi
          echo "bound to the authorised freeze"

      # The frozen verifier is authoritative for source identity; the check
      # above binds the manifest itself, this binds every file it covers.
      - name: Frozen source-freeze verification
        working-directory: docs/experiments/launch-exec-01
        run: python3 run_launch_exec_01.py --verify-freeze

      - name: Driver completeness and static posability
        working-directory: docs/experiments/launch-exec-01
        run: python3 run_launch_exec_01.py --driver-completeness

      # The frozen runner performs its own MANDATORY preflight inside run_trial,
      # immediately before the case loop, and HALTs there with zero cases posed
      # if a gate is false. That remains the authoritative gate; this step adds
      # no second implementation of it in YAML. It records the sanitised
      # environment inventory first, so a hopeless host is on the record before
      # the boundary rather than only after it. --preflight-only poses nothing,
      # builds nothing and creates no child.
      - name: Preflight inventory (poses no case)
        working-directory: docs/experiments/launch-exec-01
        run: |
          set -eu
          python3 run_launch_exec_01.py --preflight-only > preflight.json
          cat preflight.json

      # ====================================================================
      # THE IMMUTABILITY BOUNDARY IS BELOW THIS LINE.
      # Everything above poses nothing. This step is the trial: it runs exactly
      # once, is never retried, and its exit code is recorded rather than acted
      # on here so that evidence preservation cannot be skipped.
      # MECHANISM_REJECTED and MECHANISM_INCONCLUSIVE are legitimate outcomes.
      # ====================================================================
      - name: THE AUTHORISED TRIAL — poses every preregistered case once
        id: trial
        working-directory: docs/experiments/launch-exec-01
        run: |
          set +e
          python3 run_launch_exec_01.py --i-have-owner-authorisation-d7 > evidence.json
          code=$?
          set -e
          echo "runner exit code: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Trial summary
        if: always() && steps.trial.outcome != 'skipped'
        working-directory: docs/experiments/launch-exec-01
        run: |
          set -eu
          if [ ! -s evidence.json ]; then
            echo "no evidence document was produced"
            exit 0
          fi
          sha256sum evidence.json preflight.json
          python3 - <<'PY'
          import json
          d = json.load(open("evidence.json"))
          print("status   :", d.get("status"))
          print("aggregate:", d.get("aggregate"))
          print("counts   :", json.dumps(d.get("counts"), sort_keys=True))
          PY

      # Preservation, never reinterpretation. It runs after a green trial, after
      # MECHANISM_REJECTED, after MECHANISM_INCONCLUSIVE and after a non-zero
      # runner, and it preserves partial evidence exactly rather than provoking
      # a rerun. Only the two SANITISED documents the frozen publication
      # boundary produced are uploaded: no raw trace, no captured stream bytes,
      # no unsanitised environment, no build directory.
      - name: Preserve the sanitised evidence
        if: always() && steps.trial.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: launch-exec-01-evidence
          path: |
            docs/experiments/launch-exec-01/evidence.json
            docs/experiments/launch-exec-01/preflight.json
          if-no-files-found: error
          retention-days: 90

      # Only now may the job's status reflect what the trial command actually
      # did. Never before preservation.
      - name: Report the trial command outcome
        if: always() && steps.trial.outcome != 'skipped'
        run: |
          set -eu
          code='${{ steps.trial.outputs.code }}'
          echo "trial command exit code: $code"
          test "$code" = "0"
