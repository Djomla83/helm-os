name: helm-launch portable model, Linux capability admission, Linux backend and public launch

# helm-launch implements three owner-authorised slices. P1 is a portable, pure
# model: plan parsing, the receipt model and serializer, the error vocabulary,
# and pure descriptor-layout and lifecycle models. P2 adds Linux x86_64
# capability admission and authorisation composition: safe descriptor
# inspection, positional reads and pre-execution executable measurement through
# a descriptor the caller moves in. P3 adds a **crate-private** Linux x86_64
# process-creation backend: the one scoped `unsafe` module, a raw x86_64 syscall
# shim, `clone3(CLONE_PIDFD)`, the closed post-clone child contract and an
# `execveat` of the exact admitted descriptor.
#
# P4 adds the public `launch` and `LaunchOutcome` on the Linux x86_64 cohort, the
# observation loop, the run deadline, `SIGTERM`, the grace period, `SIGKILL`, the
# bounded drains, the guarded process-group cleanup sweep and a real receipt. No
# process handle, pidfd, child pid, process group or raw descriptor is public,
# and `tests/p4_boundary.rs` plus `compile_fail` doctests fail if one appears.
# P4 adds **no** `unsafe`: the whole lifecycle is safe `rustix` in
# `src/launch.rs`, outside the backend boundary.
#
# The group sweep is **best-effort cleanup, not containment**: issuing it says
# only that the one call was made. Nothing here claims a descendant received it,
# died, or that a process tree was contained.
#
# **The Linux x86_64 job does create and execute processes**, which is exactly
# the newly authorised P3 capability and ordinary validation of it. Every fixture
# is newly written in the crate and compiled by `rustc` at test time. No
# LAUNCH-EXEC-01 asset, no `launcher_spike`, no frozen Python runner and no
# frozen helper ELF is built or run. This is **not** a trial, not Trial #4 and
# not D-7 activity, it dispatches nothing, needs no root and changes no
# privilege.
#
# Off the Linux x86_64 cohort the P2 authority API and the P3 backend must not
# exist at all — `compile_fail` doctests in the crate root prove that on Windows
# and macOS, and neither runs any backend test.
#
# The P3 evidence model has **two** gates, and neither replaces the other
# (owner disposition of P3R-02, 2026-09-18):
#
#   MACHINE-CODE GATE  no forbidden userspace runtime helper in the child's
#                      emitted call closure. `strace` cannot see `memcpy`, a
#                      panic helper or an allocator call that issues no syscall.
#   STRACE GATE        no forbidden syscall in the runtime child window. The
#                      machine-code gate cannot see what the kernel was asked.

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/helm-launch/**'
      - 'tools/tests/test_helm_launch_confinement.py'
      - 'tools/tests/test_helm_launch_machine_proofs.py'
      - 'tools/helm_launch_child_closure.py'
      - 'tools/helm_launch_injection_proof.py'
      - '.github/workflows/helm-launch.yml'
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/helm-launch/**'
      - 'tools/tests/test_helm_launch_confinement.py'
      - 'tools/tests/test_helm_launch_machine_proofs.py'
      - 'tools/helm_launch_child_closure.py'
      - 'tools/helm_launch_injection_proof.py'
      - '.github/workflows/helm-launch.yml'

  # Re-test an exact branch or ref on purpose, without a no-op source commit.
  workflow_dispatch:

# A newer run for the same workflow and ref makes an older, still-running one
# stale, so cancel it instead of consuming runners for a result nobody reads.
# This cancels only overlapping runs; it never relaxes a check or a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  purity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup default 1.95.0

      - name: Record the runner
        run: |
          rustc -vV
          cargo -V

      # The Linux job is the load-bearing backend runner. Its tests compile
      # fixtures with `rustc`, trace a launcher process with `strace -f`, and
      # build one tiny test-only C helper that registers `pthread_atfork`
      # handlers so a test can prove they do NOT run across the raw clone. A
      # missing tool is a test environment failure with an explicit message,
      # never a silent skip, so it is checked here first.
      - name: Check the Linux backend test tools
        if: runner.os == 'Linux'
        run: |
          set -eux
          strace --version
          cc --version
          rustc --version

      - run: cargo fmt --check
      - run: cargo clippy -p helm-launch --all-targets --all-features --locked -- -D warnings
      - run: cargo test -p helm-launch --locked

      # The non-default fault-injection feature. It exists only for S5 (a child
      # that dies before exec without a record) and S6 (a child that stalls
      # before exec), and for the child-stage failure paths no host state can
      # provoke. It is gated on the feature AND on `debug_assertions`.
      - run: cargo test -p helm-launch --locked --features test-fault-injection

      - run: cargo build -p helm-launch --release --locked

      # THE P4 LIFECYCLE GATE. These cases create real children, drive the real
      # observation loop against them, and exercise the deadline, the grace
      # period, `SIGKILL`, the bounded drains, the guarded group sweep and the
      # receipt. They are the only place the P4 loop is executed rather than
      # inspected, so a green boundary suite never stands in for them.
      - name: Name and run the P4 lifecycle and receipt cases
        if: runner.os == 'Linux'
        run: |
          cargo test -p helm-launch --locked --lib -- --list
          cargo test -p helm-launch --locked --lib -- --nocapture launch::tests::

      # The real loop must agree with the pure model P1 tests everywhere. The
      # model half runs on all three platforms above; this names it explicitly on
      # Linux, beside the real loop, so a divergence is visible in one log.
      - name: Name and run the pure lifecycle model beside it
        if: runner.os == 'Linux'
        run: |
          cargo test -p helm-launch --locked --lib -- --nocapture lifecycle::tests::

      # THE MACHINE-CODE GATE. Source scanning cannot see code the compiler
      # inserts, and the earlier candidate's child window did call `memcpy` and
      # two panic helpers without any source token saying so. This reads the
      # assembly the compiler actually emits for the Linux x86_64 child path,
      # walks the call closure from `child_main` transitively, and fails on any
      # external runtime helper. It fails loudly on a missing root, an empty
      # body, an unresolved indirect call, a missing syscall or a failed
      # positive control, so "no findings" can never mean "found nothing".
      - name: Child machine-code closure — debug/test profile
        if: runner.os == 'Linux'
        run: |
          python3 tools/helm_launch_child_closure.py \
            --target-dir "${RUNNER_TEMP}/p3-closure-debug" \
            --profile test \
            --label "debug/test profile (the profile the P3 tests execute)"

      # The same contract under production codegen. A plain release library
      # build discards the whole backend, so release codegen settings are
      # applied to the profile that does instantiate the child.
      - name: Child machine-code closure — release codegen
        if: runner.os == 'Linux'
        run: |
          python3 tools/helm_launch_child_closure.py \
            --target-dir "${RUNNER_TEMP}/p3-closure-release" \
            --profile test \
            --rustc-flag=-Copt-level=3 \
            --rustc-flag=-Cdebug-assertions=off \
            --label "release codegen (opt-level=3, debug-assertions=off)"

      # THE INJECTION PROOF. Fresh build roots, the exact artifact taken from
      # cargo's own compiler-artifact record rather than a wildcard, every
      # archive member inspected, and a positive control so that ABSENT cannot
      # mean "looked at the wrong file".
      - name: Fault-injection positive control and release absence proof
        if: runner.os == 'Linux'
        run: |
          python3 tools/helm_launch_injection_proof.py \
            --root "${RUNNER_TEMP}/p3-injection" \
            --target x86_64-unknown-linux-gnu

      # A release library contains no backend at all, because P3 adds no public
      # consumer for it. Stated as its own check so the fact is visible rather
      # than inferred from the absence of a symbol nobody looked for.
      - name: Confirm a release library instantiates no backend
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/p3-release-lib"
          rm -rf "$out"
          cargo rustc -p helm-launch --lib --locked --release --all-features \
            --target x86_64-unknown-linux-gnu --target-dir "$out" -- --emit=asm
          asm=$(find "$out" -name 'helm_launch-*.s' -print -quit)
          if [ -z "$asm" ]; then
            echo "TEST ENVIRONMENT FAILURE: no assembly was emitted for the release library."
            exit 1
          fi
          if grep -q 'backend5child10child_main' "$asm"; then
            echo "FAILURE: a release library instantiated the P3 child entry point."
            exit 1
          fi
          echo "release library instantiates no backend, as expected: $asm"

      # The Linux backend suite, named so the log shows which cases the cohort
      # actually exercised and a silently empty suite cannot pass unnoticed.
      # These cases DO create and execute purpose-built test processes.
      - name: Name the Linux x86_64 capability-admission cases
        if: runner.os == 'Linux'
        run: |
          cargo test -p helm-launch --locked --test linux_admission -- --nocapture --list
          cargo test -p helm-launch --locked --test linux_admission

      - name: Name and run the P3 backend and traced-window cases
        if: runner.os == 'Linux'
        run: |
          cargo test -p helm-launch --locked --lib -- --list
          cargo test -p helm-launch --locked --lib -- --nocapture backend::tests::

      - name: Run the P3 fault-injection cases
        if: runner.os == 'Linux'
        run: |
          cargo test -p helm-launch --locked --features test-fault-injection --lib -- --nocapture backend::tests::

      # Off the cohort the P2 authority API and the P3 backend must be absent,
      # which the crate root's `compile_fail` doctests assert; `cargo test`
      # above runs them. These steps state the expectation in the log.
      - name: Confirm the admission suite is empty off the cohort
        if: runner.os != 'Linux'
        run: cargo test -p helm-launch --locked --test linux_admission -- --list

      - name: Confirm no backend or launch test exists off the cohort
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -eux
          if cargo test -p helm-launch --locked --lib -- --list | grep -q 'backend::'; then
            echo "FAILURE: a backend test exists off the Linux x86_64 cohort."
            exit 1
          fi
          if cargo test -p helm-launch --locked --lib -- --list | grep -q 'launch::'; then
            echo "FAILURE: a P4 launch test exists off the Linux x86_64 cohort."
            exit 1
          fi
          echo "no backend and no launch test off the cohort, as the gate requires"

      # The structural boundary suites run identically on all three platforms:
      # they read the tree and the manifests and execute nothing.
      - name: Run the unsafe-confinement and boundary suites
        run: |
          cargo test -p helm-launch --locked --test p4_boundary -- --nocapture
          cargo test -p helm-launch --locked --test p3_boundary -- --nocapture
          cargo test -p helm-launch --locked --test p2_boundary

      # The runner's preinstalled interpreter, as the other workflows use. The
      # checks read the tree and the manifests only, so one platform proves
      # them; the Linux workspace workflow also runs them through its
      # `tools/tests` discovery.
      - name: Repository-level confinement checks, independent of cargo
        if: runner.os == 'Linux'
        run: |
          python3 -m unittest tools.tests.test_helm_launch_confinement -v
          python3 -m unittest tools.tests.test_helm_launch_machine_proofs -v

      # The determinism anchors. Exact bytes and digests are asserted inside the
      # tests, so a platform-dependent serializer or parser fails above rather than
      # producing per-platform "expected" values. These steps print the identities
      # so the three runs can also be compared by eye in the logs.
      - name: Print the deterministic receipt and plan identities
        run: |
          cargo test -p helm-launch --locked --lib -- --nocapture one_platform_independent_identity
          cargo test -p helm-launch --locked --test plan_contract -- --nocapture a_fixed_plan_has_one_exact_byte_identity
