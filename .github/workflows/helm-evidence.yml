name: HELM Rust workspace Linux

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/helm-evidence/**'
      - 'crates/helm-app-spec/**'
      - 'crates/helm-observe/**'
      - 'tools/helm_evidence_linux_probe.py'
      - 'tools/helm_app_spec_fixture.py'
      - 'tools/helm_app_spec_independent_review.py'
      - 'tools/helm_app_spec_review_bench.rs'
      - 'tools/helm_app_spec_purity_probe.py'
      - 'tools/tests/**'
      - '.github/workflows/helm-evidence.yml'
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/helm-evidence/**'
      - 'crates/helm-app-spec/**'
      - 'crates/helm-observe/**'
      - 'tools/helm_evidence_linux_probe.py'
      - 'tools/helm_app_spec_fixture.py'
      - 'tools/helm_app_spec_independent_review.py'
      - 'tools/helm_app_spec_review_bench.rs'
      - 'tools/helm_app_spec_purity_probe.py'
      - 'tools/tests/**'
      - '.github/workflows/helm-evidence.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # Fixture provenance tests read original preregistration Git blobs.
          fetch-depth: 0
      # Pin the stable version independently validated on Windows and Ubuntu.
      # Toolchain updates require a reviewed change and workspace checks.
      - name: Install Rust 1.95.0
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup default 1.95.0
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Separate invocations preserve helm-evidence's standalone SHA backend.
      # Workspace tests above still exercise the unified force-soft graph.
      - run: cargo test -p helm-evidence --locked
      - run: cargo build -p helm-app-spec --release --locked
      - run: cargo build -p helm-evidence --release --locked
      # Linux-only observation backend; prints the fixture filesystem cohort.
      - run: cargo test -p helm-observe --locked -- --nocapture
      - run: python3 -m unittest discover -s tools/tests -v
      - run: python3 tools/validate_docs.py
      - run: python3 tools/helm_app_spec_fixture.py
      - name: Independent app-spec properties and cross-crate comparison
        run: python3 tools/helm_app_spec_independent_review.py --output target/helm-app-spec-independent/linux.json
