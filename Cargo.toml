[workspace]
members = [
    "crates/helm-evidence",
    "crates/helm-app-spec",
    "crates/helm-observe",
    "crates/helm-bind",
    "crates/helm-launch",
]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
